name: Sync site to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/oss_sync.mjs"
      - ".github/workflows/oss.yml"

  workflow_dispatch:
    inputs:
      delete_orphans:
        description: 删除 OSS 的 afan-qisi/ 中已不在 public/ 的旧文件
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oss-sync-afan-qisi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Upload site to OSS
        env:
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
          OSS_BUCKET: ycc-prd
          OSS_REGION: cn-shanghai
          OSS_PREFIX: van-school-2606/afan-qisi
          OSS_SOURCE: public
          OSS_SYNC_DELETE: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_orphans || false }}
        run: node scripts/oss_sync.mjs
